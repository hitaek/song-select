<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gallery Grid</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --glow: 0 0 18px 4px rgba(255, 255, 255, 0.18), 0 0 40px 8px rgba(255, 255, 255, 0.07);
      --glow-hover: 0 0 28px 8px rgba(255, 255, 255, 0.32), 0 0 60px 16px rgba(255, 255, 255, 0.12);
      --title-color: #e8e8e8;
      --title-font: 'Bebas Neue', sans-serif;
      --gap: clamp(10px, 2vw, 22px);
      --pad: clamp(10px, 2.5vw, 28px);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'Outfit', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--pad);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: var(--gap);
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }

    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(5px, 0.8vh, 10px);
      min-width: 0;
      min-height: 0;
    }

    .cell-title {
      font-family: var(--title-font);
      font-size: clamp(10px, 1.8vw, 22px);
      letter-spacing: 0.08em;
      color: var(--title-color);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-shadow: 0 0 12px rgba(255,255,255,0.3);
      flex-shrink: 0;
    }

    .cell-link {
      display: block;
      flex: 1;
      width: 100%;
      min-height: 0;
      border-radius: clamp(6px, 1vw, 12px);
      overflow: hidden;
      box-shadow: var(--glow);
      transition: box-shadow 0.35s ease, transform 0.3s ease;
      position: relative;
      background: #111;
      cursor: pointer;
      text-decoration: none;
    }

    .cell-link::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: none;
      transition: border-color 0.35s ease;
    }

    .cell-link:hover {
      box-shadow: var(--glow-hover);
      transform: scale(1.035);
    }

    .cell-link:hover::after {
      border-color: rgba(255, 255, 255, 0.28);
    }

    .cell-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease, filter 0.35s ease;
      filter: brightness(0.88) saturate(0.9);
    }

    .cell-link:hover img {
      transform: scale(1.06);
      filter: brightness(1.05) saturate(1.1);
    }

    /* Mobile: stack to 2x4 below 520px */
    @media (max-width: 520px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(4, 1fr);
      }
      .cell-title {
        font-size: clamp(9px, 3vw, 14px);
      }
    }
  </style>
</head>
